<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101013">
  <title>tsfm-lab</title>
  <meta name="description" content="Local sandbox to run, compare and inspect time-series foundation models. Unofficial, not affiliated with Mistral AI.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff5229' d='M1 0h6v1H1zM1 7h6v1H1zM2 1h1v2H2zM5 1h1v2H5zM3 3h2v1H3zM3 4h2v1H3zM2 5h4v2H2z'/%3E%3C/svg%3E">
  <script>
    // Theme before first paint: stored choice (system | light | dark); DARK by default, as on mistral.ai.
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('tsfm-theme') || 'dark'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      var m = document.querySelector('meta[name=theme-color]');
      if (m) m.content = dark ? '#101013' : '#fbfbf8';
    })();
  </script>
  <link rel="stylesheet" href="/dist/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">tsfm-lab needs JavaScript.</p></noscript>
  <script src="/vendor/echarts.min.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
