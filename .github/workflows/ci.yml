# Manual cross-platform check. It never runs on its own: start it from the Actions tab (or `gh workflow run ci.yml`)
# when a batch of substantial changes is ready, so the minutes of the plan are spent deliberately.
# Billing multipliers on private repositories: Linux x1, Windows x2, macOS x10.
name: Cross-platform check

on:
  workflow_dispatch:
    inputs:
      systems:
        description: "Which systems to run"
        type: choice
        default: all
        options: [all, linux, windows, macos]

concurrency:
  group: cross-platform-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    if: inputs.systems == 'all' || inputs.systems == 'linux'
    uses: ./.github/workflows/check.yml
    with: { runner: ubuntu-latest, device: cpu, python: .venv/bin/python }
  windows:
    if: inputs.systems == 'all' || inputs.systems == 'windows'
    uses: ./.github/workflows/check.yml
    with: { runner: windows-latest, device: cpu, python: .venv/Scripts/python.exe }
  macos:
    if: inputs.systems == 'all' || inputs.systems == 'macos'
    uses: ./.github/workflows/check.yml
    with: { runner: macos-latest, device: pypi, python: .venv/bin/python }
