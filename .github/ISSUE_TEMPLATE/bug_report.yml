name: Bug report
description: Something does not work, or gives a wrong or confusing result
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a **security** problem do not open an issue: use the repository's Security tab (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The page you were on, what you clicked or ran, and the error message if there is one.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `python scripts/doctor.py` (it lists the system, Python, PyTorch and devices; it contains no secrets).
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `git rev-parse --short HEAD`.
  - type: dropdown
    id: device
    attributes:
      label: Compute device
      options: [CPU, NVIDIA GPU (CUDA), Apple GPU (Metal), Not sure]
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The model and dataset involved, a screenshot, the relevant lines of the server log.
