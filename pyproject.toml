[project]
name = "tsfm-lab"
version = "0.1.0"
description = "Local sandbox to run, compare and inspect time-series foundation models (Timestral first). Unofficial, not affiliated with Mistral AI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Leonardo Galli" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "pyarrow>=17",
    "psutil>=6",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "timestral",
    "chronos-forecasting>=2.3,<3",  # Amazon's Chronos-2 (Apache-2.0); official PyPI package
    "timesfm>=3.0.2,<4",  # Google's TimesFM 2.5 and 3.0 (code Apache-2.0); torch comes from the project extras
    "tirex-2==0.4.0",  # NXAI's TiRex-2 (Apache-2.0, pure Python); runs on pure-PyTorch kernels. Its dependency mlstm_kernels is under the NXAI Community Licence
    "tfc-t0==0.6.0",  # The Forecasting Company's t0 (Apache-2.0, pure Python); its torch extra is replaced by the three lines below
    "rotary-embedding-torch>=0.8",
    "einops>=0.7",
]

# PyTorch comes from exactly one of these extras (chosen by scripts/bootstrap.py):
#   cu130 -> CUDA 13.0 build (Windows/Linux + NVIDIA Turing or newer, incl. RTX 50xx; needs a driver 580 or newer). It also runs on CPU.
#   cpu   -> small CPU-only build (Windows/Linux without NVIDIA)
#   pypi  -> the standard PyPI wheel (macOS); stays on 2.11.0 until the Apple GPU path is re-checked with a newer PyTorch
# PyTorch stopped publishing CUDA 12.8 builds after 2.11, so 2.13 (which fixes GHSA-rrmf-rvhw-rf47) needs the CUDA 13.0 index.
[project.optional-dependencies]
cu130 = ["torch==2.13.0"]
cpu = ["torch==2.13.0"]
pypi = ["torch==2.11.0"]

[project.scripts]
tsfm-lab = "tsfm_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "playwright>=1.48"]  # playwright drives the installed Chrome/Edge in the interface smoke test

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsfm_lab = ["models/manifests/*.toml", "data/catalog_*.json"]  # fev, gift and monash catalogues

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads real model weights (slow, may download the 21 MB Timestral-5M checkpoint)",
    "online: needs the network (downloads a tiny public dataset from Hugging Face)",
    "ui: opens the interface in a real browser (an installed Chrome or Edge, through Playwright); skipped where there is none",
]
# Keep pytest's temp dirs and cache inside the project (nothing in the system temp folder).
addopts = "--basetemp=.cache/pytest"
cache_dir = ".cache/pytest_cache"

[tool.uv]
conflicts = [
    [
        { extra = "cu130" },
        { extra = "cpu" },
        { extra = "pypi" },
    ],
]

[tool.uv.sources]
# The package is not on PyPI (issue #5 upstream), so it is pinned by commit.
# macOS uses a one-commit fork of that same upstream commit: it runs the float64 statistics on the CPU, which is what
# makes the Apple GPU (MPS) usable (upstream issue #6). Reviewed on 2026-10-27: the only commit on top of the pinned
# upstream commit, 3 files (2 of code, 1 of tests), no new dependency, no network, process, environment or file access.
# Windows and Linux stay on the official repository. Drop the second entry when upstream merges the fix.
timestral = [
    { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff", marker = "sys_platform != 'darwin'" },
    { git = "https://github.com/paschembri/timestral.git", rev = "c49d40f08dc75c05d7489a3ef26fb3fd565584c7", marker = "sys_platform == 'darwin'" },
]
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
